name: Compilar APK Android TV

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Buscar y dar permisos a gradlew
        run: |
          chmod +x android-studio-project/gradlew || true

      - name: Compilar APK Debug
        run: |
          cd android-studio-project
          ./gradlew :RTSP-IPCam-Viewer:assembleDebug --rerun-tasks

      - name: Subir archivo APK resultante
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android-studio-project/**/build/outputs/apk/**/*.apk
