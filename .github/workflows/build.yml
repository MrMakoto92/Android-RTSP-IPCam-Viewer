name: Compilar APK Android TV

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo fuente
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Dar permisos de ejecucion a Gradle
      run: chmod +x android-studio-project/gradlew
      working-directory: android-studio-project

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug
      working-directory: android-studio-project

    - name: Subir archivo APK resultante
      uses: actions/upload-artifact@v4
      with:
        name: IPCam-Viewer-TV-Debug
        path: android-studio-project/app/build/outputs/apk/debug/app-debug.apk
