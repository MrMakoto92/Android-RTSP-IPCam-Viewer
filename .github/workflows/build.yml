name: Compilar APK Android TV

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo fuente
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Buscar y dar permisos a gradlew
      run: |
        GRADLEW_PATH=$(find . -name gradlew -type f | head -n 1)
        echo "Gradlew encontrado en: $GRADLEW_PATH"
        chmod +x "$GRADLEW_PATH"
        BUILD_DIR=$(dirname "$GRADLEW_PATH")
        echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

    - name: Compilar APK Debug
      run: |
        cd "$BUILD_DIR"
        ./gradlew assembleDebug

    - name: Subir archivo APK resultante
      uses: actions/upload-artifact@v4
      with:
        name: IPCam-Viewer-TV-Debug
        path: "**/build/outputs/apk/debug/*.apk"
